# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agripulse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# Security & AI Environment Variables
# ----------------------------------------
jwt.secret=${JWT_SECRET:defaultSecretKeyWithAtLeast32BytesLengthForHS256Security}
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}