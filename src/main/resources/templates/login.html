<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPulse Matrix - Gateway Portal</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-900 via-emerald-800 to-stone-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-8">
        
        <!-- Portal Header / Logo Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full text-2xl font-bold mb-3 shadow-inner">
                🌾
            </div>
            <h1 class="text-2xl font-black text-stone-800 tracking-tight">AgriPulse Matrix</h1>
            <p class="text-sm text-stone-500 mt-1">Smart Agricultural Intelligence Gateway</p>
        </div>

        <!-- Error / Logout Alerts -->
        <div th:if="${param.error}" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center">
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg text-sm text-center">
            You have been securely logged out.
        </div>

        <!-- Standard Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Email / Enrolment Number</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-stone-800 text-sm transition"
                    placeholder="Enter your registered email">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Password</label>
                <input type="password" name="password" 
                    class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none text-stone-800 text-sm transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm">
                Login
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-stone-200"></div>
            <span class="flex-shrink mx-4 text-stone-400 text-xs uppercase tracking-wider">Or continue with</span>
            <div class="flex-grow border-t border-stone-200"></div>
        </div>

        <!-- Google OAuth Sign In Button -->
        <a href="/oauth2/authorization/google" 
            class="w-full flex items-center justify-center gap-3 py-3 border border-stone-300 hover:bg-stone-50 text-stone-700 font-medium rounded-lg transition duration-200 text-sm shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.83 0 11.6s.43 3.48 1.18 5.01l4.09-3.37z"/>
                <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.37c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Sign in with Google
        </a>

        <!-- Footer Actions (New Registration & Reset Password) -->
        <div class="mt-6 flex items-center justify-between text-xs font-medium">
            <a href="/onboarding" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md shadow transition">
                New Registration
            </a>
            <a href="#" class="text-stone-500 hover:text-emerald-700 transition">
                Reset Password
            </a>
        </div>

    </div>

</body>
</html>
