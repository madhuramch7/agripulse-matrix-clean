<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - AgriPulse Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FAF8F5] min-h-screen flex flex-col text-[#3D312A]">
    <header class="bg-[#3D312A] px-6 py-4 flex items-center space-x-3 shadow-md">
        <div class="w-10 h-10 rounded-xl bg-[#A0522D] flex items-center justify-center text-white text-xl shadow-md">
            <i class="fa-solid fa-wheat-awn"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold tracking-tight text-[#FAF8F5]">AgriPulse Matrix</h1>
            <p class="text-xs text-[#D9A378] font-medium tracking-wide">SMART AGRICULTURAL INTELLIGENCE</p>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-3xl w-full">
            <h2 class="text-2xl font-bold text-center mb-2">Welcome to AgriPulse Matrix</h2>
            <p class="text-center text-sm text-[#7A6A5E] mb-8">Are you a new user or an existing user?</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <a href="/register.html" class="bg-white border border-[#EAE3D2] rounded-2xl p-8 shadow-sm hover:shadow-md transition-all text-center block">
                    <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-[#FAF8F5] flex items-center justify-center text-[#A0522D] text-xl"><i class="fa-solid fa-user-plus"></i></div>
                    <h3 class="text-lg font-semibold mb-1">New user</h3>
                    <p class="text-xs text-[#7A6A5E]">Create an account with your email and set up your farm profile.</p>
                </a>
                <a href="/login.html" class="bg-white border border-[#EAE3D2] rounded-2xl p-8 shadow-sm hover:shadow-md transition-all text-center block">
                    <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-[#FAF8F5] flex items-center justify-center text-[#A0522D] text-xl"><i class="fa-solid fa-right-to-bracket"></i></div>
                    <h3 class="text-lg font-semibold mb-1">Existing user</h3>
                    <p class="text-xs text-[#7A6A5E]">Sign in with your email and password.</p>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
