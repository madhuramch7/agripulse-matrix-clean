<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPulse Matrix - Farm Onboarding</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-lg w-full bg-white shadow-lg rounded-xl p-8 m-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-700">AgriPulse Matrix</h1>
            <p class="text-gray-600 mt-2">Complete your farm profile to unlock personalized agricultural intelligence.</p>
        </div>

        <form id="onboardingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Farm Size (Acres)</label>
                <input type="number" step="0.1" id="farmSize" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500" placeholder="e.g., 5.5">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">State</label>
                <input type="text" id="state" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500" placeholder="e.g., Maharashtra">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">District</label>
                <input type="text" id="district" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500" placeholder="e.g., Pune">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Primary Crop</label>
                <input type="text" id="primaryCrop" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500" placeholder="e.g., Wheat, Soybean">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Soil Type</label>
                <select id="soilType" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500">
                    <option value="">Select Soil Type</option>
                    <option value="Alluvial">Alluvial</option>
                    <option value="Black">Black (Regur)</option>
                    <option value="Red">Red</option>
                    <option value="Laterite">Laterite</option>
                    <option value="Sandy">Sandy</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Irrigation Type</label>
                <select id="irrigationType" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500">
                    <option value="">Select Irrigation Method</option>
                    <option value="Canal">Canal</option>
                    <option value="Borewell/TubeWell">Borewell / Tubewell</option>
                    <option value="Drip">Drip Irrigation</option>
                    <option value="Rainfed">Rainfed</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-green-700 transition duration-200 shadow-md">
                Save Profile & Access Dashboard
            </button>
        </form>
    </div>

    <script>
        document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                farmSize: parseFloat(document.getElementById('farmSize').value),
                state: document.getElementById('state').value,
                district: document.getElementById('district').value,
                primaryCrop: document.getElementById('primaryCrop').value,
                soilType: document.getElementById('soilType').value,
                irrigationType: document.getElementById('irrigationType').value
            };

            try {
                const response = await fetch('/api/onboarding/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Failed to submit onboarding data.'));
                }
            } catch (error) {
                console.error('Submission error:', error);
                alert('Network error while saving profile.');
            }
        });
    </script>
</body>
</html>
