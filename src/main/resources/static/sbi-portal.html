<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI Agri Portal - Partner Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Bank Header Banner -->
        <div class="bg-sky-700 p-6 text-white text-center">
            <div class="inline-block bg-white text-sky-800 font-black px-3 py-1 rounded text-xl mb-2">SBI</div>
            <h1 class="text-xl font-bold">State Bank of India</h1>
            <p class="text-xs text-sky-100 mt-1">Agri-Credit Direct Sanction Gateway</p>
        </div>

        <div class="p-6 space-y-6">
            <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 text-xs text-sky-900 space-y-1">
                <div class="font-bold text-sm text-sky-950">Application Handoff Received</div>
                <p>Source Partner: <strong class="text-emerald-800">AgriPulse Matrix Engine</strong></p>
                <p>Verified APCI Score: <strong class="text-sky-700">780 / 900 (Tier 1)</strong></p>
            </div>

            <form id="sbiForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase">Selected Scheme</label>
                    <input type="text" value="SBI Agri-Gold Crop Support Loan (4.5% p.a.)" disabled 
                        class="mt-1 w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase">Requested Sanction Amount (₹)</label>
                    <input type="number" id="loanAmount" value="250000" max="300000" required
                        class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase">Aadhaar / Bank Reg Number</label>
                    <input type="text" placeholder="XXXX-XXXX-1234" required
                        class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <button type="submit" 
                    class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
                    Confirm & Submit Direct Application
                </button>
            </form>

            <div id="loanStatus" class="hidden text-center text-xs font-bold p-3 rounded-lg"></div>

            <div class="text-center pt-2">
                <a href="loans.html" class="text-xs text-slate-500 hover:text-slate-800">← Return to AgriPulse Matrix</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sbiForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const status = document.getElementById('loanStatus');
            const amount = document.getElementById('loanAmount').value;

            status.textContent = `Processing SBI Direct Application for ₹${parseInt(amount).toLocaleString()}... Approved! Reference ID: SBI-AGRI-${Math.floor(100000 + Math.random() * 900000)}`;
            status.className = "text-xs font-bold p-3 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300";
            status.classList.remove('hidden');
        });
    </script>
</body>
</html>
